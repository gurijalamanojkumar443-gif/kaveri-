services:
  # ─── Backend: FastAPI Web Service ───────────────────────────────────────────
  - type: web
    name: kaveri-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kaveri-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health

  # ─── Frontend: Static Site ──────────────────────────────────────────────────
  - type: web
    name: kaveri-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ─── PostgreSQL Managed Database ────────────────────────────────────────────
  - name: kaveri-db
    databaseName: kaveri
    user: kaveri_user
    plan: free
